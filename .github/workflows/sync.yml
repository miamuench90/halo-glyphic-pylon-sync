name: Sync Glyphic Calls to Pylon

on:
  schedule:
    - cron: '0 9 * * *'  # Runs every day at 9:00 AM UTC
  workflow_dispatch:      # Also allows you to run it manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          GLYPHIC_API_KEY: ${{ secrets.GLYPHIC_API_KEY }}
          PYLON_API_KEY: ${{ secrets.PYLON_API_KEY }}
        run: python sync.py
